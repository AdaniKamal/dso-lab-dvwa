  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto --error