name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@729e0f967409dceb0a898cdd94a5534719f85c36
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML: true

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: super-linter

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto --error

  trivy-fs:
    name: Trivy Filesystem Scan

    runs-on: ubuntu-latest

    needs: semgrep

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  trivy-image:
    name: Trivy Docker Image Scan

    runs-on: ubuntu-latest

    needs: trivy-fs

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Pull DVWA Image
        run: docker pull vulnerables/web-dvwa:latest

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: vulnerables/web-dvwa:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

  zap-scan:
    name: OWASP ZAP DAST Scan

    runs-on: ubuntu-latest

    needs: trivy-image

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Start DVWA
        run: docker compose up -d

      - name: Wait for DVWA
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "DVWA is ready."
              exit 0
            fi
            echo "Waiting..."
            sleep 5
          done
          echo "DVWA failed to start."
          exit 1